<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>OG Card – Martin Rodrigo Morales</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #060D1A;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Background grid ── */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(6,182,212,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6,182,212,0.06) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── Radial glow spots ── */
    .glow-tl {
      position: absolute;
      top: -120px; left: -120px;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(13,148,136,0.22) 0%, transparent 70%);
    }
    .glow-br {
      position: absolute;
      bottom: -140px; right: -80px;
      width: 480px; height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 70%);
    }
    .glow-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 700px; height: 340px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(6,182,212,0.05) 0%, transparent 70%);
    }

    /* ── Floating nodes (static) ── */
    .node {
      position: absolute;
      border-radius: 50%;
      opacity: 0.55;
    }
    .node-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(6,182,212,0.25);
    }

    /* ── Connector lines ── */
    .connector {
      position: absolute;
      background: linear-gradient(90deg, transparent, rgba(6,182,212,0.18), transparent);
      height: 1px;
      transform-origin: left center;
    }

    /* ── Main content ── */
    .card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 80px;
      gap: 0;
    }

    /* Avatar / icon badge */
    .badge {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0D9488, #06B6D4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 0 32px rgba(6,182,212,0.35), 0 0 0 1px rgba(6,182,212,0.2);
    }
    .badge svg {
      width: 34px;
      height: 34px;
      fill: #fff;
    }

    /* Name */
    .name {
      font-size: 62px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.05;
      background: linear-gradient(90deg, #ffffff 0%, #06B6D4 55%, #0D9488 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin-bottom: 16px;
    }

    /* Subtitle */
    .subtitle {
      font-size: 22px;
      font-weight: 500;
      color: #06B6D4;
      letter-spacing: 0.04em;
      text-align: center;
      margin-bottom: 44px;
      opacity: 0.9;
    }

    /* Divider */
    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #06B6D4, transparent);
      margin-bottom: 44px;
    }

    /* Stat boxes */
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 52px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 196px;
      padding: 18px 24px;
      border-radius: 14px;
      background: rgba(6,182,212,0.06);
      border: 1px solid rgba(6,182,212,0.2);
      box-shadow: inset 0 1px 0 rgba(6,182,212,0.1), 0 4px 24px rgba(0,0,0,0.3);
    }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: #06B6D4;
      letter-spacing: -0.5px;
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Bottom URL */
    .url-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .url-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #06B6D4;
      box-shadow: 0 0 10px rgba(6,182,212,0.6);
    }
    .url-text {
      font-size: 16px;
      font-weight: 500;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.04em;
    }

    /* ── Corner accents ── */
    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
    }
    .corner-tl { top: 24px; left: 24px; border-top: 2px solid rgba(6,182,212,0.4); border-left: 2px solid rgba(6,182,212,0.4); }
    .corner-tr { top: 24px; right: 24px; border-top: 2px solid rgba(6,182,212,0.4); border-right: 2px solid rgba(6,182,212,0.4); }
    .corner-bl { bottom: 24px; left: 24px; border-bottom: 2px solid rgba(6,182,212,0.4); border-left: 2px solid rgba(6,182,212,0.4); }
    .corner-br { bottom: 24px; right: 24px; border-bottom: 2px solid rgba(6,182,212,0.4); border-right: 2px solid rgba(6,182,212,0.4); }
  </style>
</head>
<body>

  <!-- Background layers -->

  <div class="node" style="width:7px;height:7px;background:#06B6D4;bottom:60px;left:290px;box-shadow:0 0 10px rgba(6,182,212,0.5);opacity:0.35;"></div>

  <!-- Corner accents -->
  <div class="corner corner-tl"></div>

  <!-- Main card content -->
  <div class="card">

      <svg viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">

  </div>

</body>
</html>
