<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martin Rodrigo Morales — AI Technical Lead</title>
<meta name="description" content="Martin Rodrigo Morales — AI Technical Lead & MLOps Engineer building production-grade LLM and agentic systems. 5+ years, Fortune 500 scale. Open to senior / lead AI roles.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF7; --paper2:#F4F1EA; --card:#FFFFFF;
  --ink:#22252E; --muted:#767A85; --faint:#9AA0AB; --line:#EAE6DE; --line2:#F0EDE6;
  --accent:#6E63C6; --accent-soft:#EDEAF8; --accent-ink:#584FB0;
  --p-lilac:#7A6FD0; --p-lilac-s:#ECE9F9;
  --p-sky:#5E8FC7;   --p-sky-s:#E4EEF8;
  --p-mint:#3FA383;  --p-mint-s:#E1F1EA;
  --p-blush:#D07E63; --p-blush-s:#FAEBE3;
  --p-amber:#B98F3E; --p-amber-s:#F6EFD8;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Hanken Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

.wrap{max-width:1060px;margin:0 auto;padding:0 32px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:9px}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.stitle{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4.2vw,44px);line-height:1.08;letter-spacing:-.5px;text-wrap:balance;margin:14px 0 6px}
.stitle em{font-style:italic;color:var(--accent-ink)}

/* ── Nav ── */
.nav{position:sticky;top:0;z-index:100;background:rgba(251,250,247,.72);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,background .3s}
.nav.sc{border-color:var(--line);background:rgba(251,250,247,.86)}
.nav-in{max-width:1060px;margin:0 auto;padding:15px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.3px}
.brand span{color:var(--accent)}
.nav-r{display:flex;align-items:center;gap:26px}
.nav-links{display:flex;gap:26px}
.nav-links a{font-size:13.5px;font-weight:500;color:var(--muted);transition:color .2s;position:relative}
.nav-links a::after{content:'';position:absolute;left:0;right:100%;bottom:-4px;height:1.5px;background:var(--accent);transition:right .25s ease}
.nav-links a:hover{color:var(--ink)}
.nav-links a:hover::after,.nav-links a.act::after{right:0}
.nav-links a.act{color:var(--ink)}
.langs{display:flex;background:var(--paper2);border:1px solid var(--line);border-radius:20px;padding:3px}
.langs button{font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 10px;border:none;background:none;color:var(--faint);border-radius:14px;cursor:pointer;transition:all .2s}
.langs button.on{background:var(--ink);color:var(--paper)}
.cv-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#fff;background:var(--accent);padding:9px 18px;border-radius:22px;transition:transform .2s,box-shadow .2s,background .2s}
.cv-btn:hover{transform:translateY(-1px);background:var(--accent-ink);box-shadow:0 8px 22px rgba(110,99,198,.28)}
.cv-btn svg{width:14px;height:14px}
.burger{display:none;background:none;border:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px}
.burger span{width:22px;height:2px;background:var(--ink);border-radius:2px;transition:.3s}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mob{display:none;flex-direction:column;padding:8px 32px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.mob.open{display:flex}
.mob a{padding:12px 0;font-size:15px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line2)}
.mob-langs{display:flex;gap:8px;padding:16px 0 2px}
.mob-langs button{font-family:var(--mono);font-size:12px;font-weight:600;padding:6px 16px;border:1px solid var(--line);background:none;border-radius:20px;color:var(--muted);cursor:pointer}
.mob-langs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ── Hero ── */
.hero{position:relative;padding:clamp(70px,13vh,140px) 0 clamp(56px,9vh,96px);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;pointer-events:none}
.blob.b1{width:440px;height:440px;background:var(--p-lilac-s);top:-120px;right:-80px;opacity:.8}
.blob.b2{width:360px;height:360px;background:var(--p-mint-s);top:120px;right:180px;opacity:.6}
.blob.b3{width:300px;height:300px;background:var(--p-blush-s);bottom:-90px;left:-60px;opacity:.55}
.hero-in{position:relative;z-index:2;max-width:760px}
.avail{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:6px 15px;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:26px}
.avail .pulse{width:8px;height:8px;border-radius:50%;background:var(--p-mint);box-shadow:0 0 0 0 rgba(63,163,131,.5);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,163,131,.5)}70%{box-shadow:0 0 0 7px rgba(63,163,131,0)}100%{box-shadow:0 0 0 0 rgba(63,163,131,0)}}
.hero-eye{font-family:var(--mono);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px}
.hero-name{font-family:var(--serif);font-weight:500;font-size:clamp(44px,8vw,82px);line-height:.98;letter-spacing:-1.8px;text-wrap:balance}
.hero-lead{font-size:clamp(16px,2vw,19px);color:#464A54;line-height:1.7;margin:24px 0 8px;max-width:640px}
.hero-lead b{font-weight:600;color:var(--ink)}
.hero-meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:14px}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:34px}
.hero-actions .cv-btn{padding:12px 24px;font-size:14px}
.tlink{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--muted);transition:color .2s}
.tlink svg{width:16px;height:16px}
.tlink:hover{color:var(--accent-ink)}
.hero-stats{display:flex;flex-wrap:wrap;gap:34px;margin-top:52px;padding-top:30px;border-top:1px solid var(--line)}
.stat .n{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1;letter-spacing:-1px}
.stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:7px}

/* ── Sections ── */
.section{padding:clamp(60px,9vh,104px) 0;position:relative}
.section.alt{background:var(--paper2)}
.section-head{margin-bottom:44px;max-width:640px}
.section-head .stitle{margin-bottom:0}
.lead2{font-size:16px;color:var(--muted);margin-top:14px;line-height:1.7}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}
.reveal.vs{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.avail .pulse{animation:none}}

/* ═══════════ FX LAYER (refined) ═══════════ */
.progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:130;background:var(--accent);opacity:.8}
.hero-gl{position:absolute;inset:0;z-index:1;width:100%;height:100%;display:block}
.hero-name .wm{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.hero-name .wi{display:inline-block;transform:translateY(116%);animation:wordUp 1s cubic-bezier(.2,.78,.12,1) both}
@keyframes wordUp{to{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.hero-name .wi{animation:none;transform:none}}

/* About */
.about-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:52px;align-items:start}
.about-txt p{color:#4A4E58;font-size:16px;line-height:1.8;margin-bottom:16px}
.about-txt p:last-child{margin-bottom:0}
.about-txt b{color:var(--ink);font-weight:600}
.focus{display:flex;flex-direction:column;gap:14px}
.focus-i{display:flex;gap:13px;align-items:flex-start}
.focus-dot{width:10px;height:10px;border-radius:3px;margin-top:6px;flex:none}
.focus-t{font-weight:600;font-size:14.5px}
.focus-d{font-size:13px;color:var(--muted);line-height:1.5}

/* Experience */
.exp{display:flex;flex-direction:column}
.role{display:grid;grid-template-columns:150px 1fr;gap:28px;padding:26px 0;border-top:1px solid var(--line)}
.role:last-child{border-bottom:1px solid var(--line)}
.role-year{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
.role-now{display:inline-flex;align-items:center;gap:6px;color:var(--p-mint)}
.role-now::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--p-mint)}
.role-t{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:-.3px}
.role-co{font-size:13.5px;color:var(--accent-ink);margin:3px 0 12px;font-weight:500}
.role-b{list-style:none;display:flex;flex-direction:column;gap:7px}
.role-b li{font-size:14.5px;color:#50545E;line-height:1.6;padding-left:18px;position:relative}
.role-b li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:1.5px;background:var(--line);transform:rotate(45deg)}
.m{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;padding:1px 6px;white-space:nowrap}

/* Work */
.work-feat{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.work-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.work-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;transition:transform .16s ease,box-shadow .3s,border-color .3s;position:relative;display:flex;flex-direction:column;transform-style:preserve-3d}
.work-card.feat{padding:28px}
.work-card:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(34,37,46,.09);border-color:var(--line2)}
.work-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:26px}
.work-logo{width:auto;max-width:80%;object-fit:contain;display:block}
.work-dot{width:11px;height:11px;border-radius:4px;flex:none}
.work-badge{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:4px 10px;border-radius:20px;white-space:nowrap;font-weight:500}
.work-ctx{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.work-name{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.4px;margin-bottom:8px}
.work-stack{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.6;margin-bottom:15px}
.work-b{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.work-b li{font-size:13.5px;color:#50545E;line-height:1.6;padding-left:16px;position:relative}
.work-b li::before{content:'→';position:absolute;left:0;color:var(--accent);font-size:12px;top:1px}
.work-link{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid var(--line);padding:7px 15px;border-radius:20px;transition:all .2s;align-self:flex-start;margin-top:auto}
.work-link:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.work-link svg{width:13px;height:13px}

/* Skills */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px 32px}
.skill-g .skill-l{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.skill-l .sd{width:9px;height:9px;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13px;color:#3F434D;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 11px;transition:all .2s;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent-ink);transform:translateY(-2px)}

/* Background */
.bg-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.edu-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;transition:transform .16s ease,box-shadow .3s,border-color .3s;transform-style:preserve-3d}
.edu-card:hover{box-shadow:0 16px 38px rgba(34,37,46,.08);border-color:var(--line2)}
.edu-d{font-family:var(--serif);font-weight:500;font-size:18px;margin-bottom:4px}
.edu-i{font-size:13px;color:var(--muted);margin-bottom:12px}
.edu-b{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:4px 10px;border-radius:20px}
.note{grid-column:span 2;border-radius:16px;padding:26px 28px;background:linear-gradient(135deg,var(--p-mint-s),var(--p-sky-s));border:1px solid var(--line)}
.note-l{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--p-mint);margin-bottom:10px;font-weight:500}
.note-t{font-size:14.5px;color:#414852;line-height:1.75}
.note-t b{color:var(--ink);font-weight:600}

/* Footer */
footer{background:var(--ink);color:#D8DAE0;padding:64px 0 48px}
.foot-in{max-width:1060px;margin:0 auto;padding:0 32px}
.foot-name{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,44px);color:#fff;letter-spacing:-.6px;text-wrap:balance;max-width:640px;line-height:1.1}
.foot-name em{font-style:italic;color:#B7B0E8}
.foot-sub{font-size:15px;color:#9AA0AB;margin:16px 0 32px}
.foot-links{display:flex;flex-wrap:wrap;gap:12px}
.foot-links a{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:#D8DAE0;border:1px solid rgba(255,255,255,.14);padding:10px 18px;border-radius:24px;transition:all .2s}
.foot-links a:hover{border-color:rgba(183,176,232,.6);color:#fff;background:rgba(183,176,232,.1)}
.foot-links svg{width:15px;height:15px}
.foot-bot{margin-top:44px;padding-top:24px;border-top:1px solid rgba(255,255,255,.1);font-family:var(--mono);font-size:11px;color:#767A85;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media(max-width:820px){
  .nav-links,.langs.desk{display:none}
  .burger{display:flex}
  .about-grid,.work-feat,.work-mini,.bg-grid{grid-template-columns:1fr}
  .note{grid-column:span 1}
  .work-logo{max-width:70%}
  .role{grid-template-columns:1fr;gap:6px}
  .role-year{padding-top:0}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:22px 16px}
}
</style>
</head>
<body>
<div class="progress"></div>

<header class="nav" id="nav">
  <div class="nav-in">
    <a href="#top" class="brand">Martin R. <span>Morales</span></a>
    <div class="nav-r">
      <nav class="nav-links" id="nav-links"></nav>
      <div class="langs desk" id="langs">
        <button data-l="en" class="on">EN</button>
        <button data-l="es">ES</button>
      </div>
      <a class="cv-btn" id="nav-cv" href="Martin_Morales_CV_2026.pdf" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span id="nav-cv-txt">CV</span>
      </a>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="mob" id="mob"></div>
</header>

<main id="top">
  <section class="hero">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <canvas class="hero-gl" aria-hidden="true"></canvas>
    <div class="wrap hero-in" id="hero"></div>
  </section>

  <section class="section" id="about"></section>
  <section class="section alt" id="experience"></section>
  <section class="section" id="work"></section>
  <section class="section alt" id="skills"></section>
  <section class="section" id="background"></section>
</main>

<footer id="contact"><div class="foot-in" id="foot"></div></footer>

    <div class="bg-grid">
      ${t.edu.map(e=>`<div class="edu-card reveal spot"><div class="edu-d">${e[0]}</div><div class="edu-i">${e[1]}</div><span class="edu-b" style="background:${colSoft(e[3])};color:${colOf(e[3])}">${e[2]}</span></div>`).join('')}
      <div class="note reveal"><div class="note-l">${t.note_l}</div><div class="note-t">${t.note_t}</div></div>
    </div></div>`;

  // footer
  document.getElementById('foot').innerHTML=`
    <div class="foot-name reveal">${t.foot_name}</div>

    <div class="foot-links reveal">
      <a href="mailto:mrdesautu@gmail.com">${IC.mail}mrdesautu@gmail.com</a>

      <a href="https://www.linkedin.com/in/mrdesautu" target="_blank" rel="noopener">${IC.li}LinkedIn</a>
      <a href="https://wa.me/34644875110" target="_blank" rel="noopener">${IC.wa}WhatsApp</a>
      <a href="tel:+34644875110">${IC.ph}+34 644 875 110</a>
      <a href="${t.cvfile}" download>${IC.dl}${t.cv}</a>
    </div>
    <div class="foot-bot"><span>${t.foot_bot}</span><span>Made with care · Madrid, Spain</span></div>`;

  document.title=t.doctitle;
  document.documentElement.lang=(t===D.es)?'es':'en';
  observe(); wireMob();
}

/* reveal */
let io;
function observe(){
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.reveal').forEach(el=>el.classList.add('vs'));return;}
  if(io)io.disconnect();
  io=new IntersectionObserver((es)=>{es.forEach((e,i)=>{if(e.isIntersecting){e.target.style.transitionDelay=`${Math.min(i%6,5)*60}ms`;e.target.classList.add('vs');io.unobserve(e.target);}})},{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  // count-up
  const cs=document.querySelectorAll('.n[data-c]');
  const cio=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target,raw=el.dataset.c,num=parseInt(raw),suf=raw.replace(/[0-9]/g,'');let s=null;const step=ts=>{if(!s)s=ts;const p=Math.min((ts-s)/1200,1),v=Math.round((1-Math.pow(1-p,3))*num);el.textContent=v+suf;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step);cio.unobserve(el)})},{threshold:.6});
  cs.forEach(c=>cio.observe(c));
}
function wireMob(){
  const b=document.getElementById('burger'),m=document.getElementById('mob');
  b.onclick=()=>{b.classList.toggle('open');m.classList.toggle('open')};
  m.querySelectorAll('a').forEach(a=>a.onclick=()=>{b.classList.remove('open');m.classList.remove('open')});
}

/* lang */
let lang='en';
function switchLang(l){if(l===lang)return;lang=l;render(D[lang]);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(b)switchLang(b.dataset.l);});
render(D.en);

/* nav shadow + scrollspy */
const nav=document.getElementById('nav');
addEventListener('scroll',()=>{
  nav.classList.toggle('sc',scrollY>20);
  const secs=document.querySelectorAll('main section[id]');
  let cur='';secs.forEach(s=>{if(scrollY>=s.offsetTop-120)cur=s.id});
  document.querySelectorAll('#nav-links a').forEach(a=>a.classList.toggle('act',a.getAttribute('href')==='#'+cur));
},{passive:true});

/* ═══════════ FX ═══════════ */
(function(){
  const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* scroll progress */
  const pr=document.querySelector('.progress');
  const upPr=()=>{const h=document.documentElement;pr.style.width=(h.scrollTop/((h.scrollHeight-h.clientHeight)||1)*100)+'%';};
  addEventListener('scroll',upPr,{passive:true});upPr();

  /* subtle WebGL aurora — hero background */
  const cv=document.querySelector('.hero-gl');
  let gl=null; try{gl=cv&&(cv.getContext('webgl')||cv.getContext('experimental-webgl'));}catch(e){}
  if(gl){
    const vsrc='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    const fsrc=`precision highp float;uniform float t;uniform vec2 r;uniform vec2 m;
    float h(vec2 x){return fract(sin(dot(x,vec2(12.9898,78.233)))*43758.5453);}
    float nz(vec2 x){vec2 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
      float a=h(i),b=h(i+vec2(1,0)),c=h(i+vec2(0,1)),d=h(i+vec2(1,1));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
    float fbm(vec2 x){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*nz(x);x*=2.02;a*=.5;}return v;}
    void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv;p.x*=r.x/r.y;
      vec2 mo=(m-.5);
      float f1=fbm(p*1.5+vec2(t*.012,t*.008)+mo*.12);
      float f2=fbm(p*2.3+vec2(-t*.010,t*.006)+f1);
      vec3 lil=vec3(.93,.91,.98),sky=vec3(.87,.94,.985),mnt=vec3(.89,.97,.93),bl=vec3(.99,.93,.90);
      vec3 col=mix(lil,sky,smoothstep(.2,.85,f1));
      col=mix(col,mnt,smoothstep(.35,.95,f2));
      col=mix(col,bl,pow(clamp(f1*f2,0.,1.),1.6)*.7);
      vec3 paper=vec3(.984,.980,.969);
      col=mix(paper,col,.8);
      gl_FragColor=vec4(col,1.);}`;
    const mk=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o;};
    const pg=gl.createProgram();
    gl.attachShader(pg,mk(gl.VERTEX_SHADER,vsrc));gl.attachShader(pg,mk(gl.FRAGMENT_SHADER,fsrc));
    gl.linkProgram(pg);gl.useProgram(pg);
    const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const lp=gl.getAttribLocation(pg,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
    const ut=gl.getUniformLocation(pg,'t'),ur=gl.getUniformLocation(pg,'r'),um=gl.getUniformLocation(pg,'m');
    let mm=[.5,.5];
    addEventListener('mousemove',e=>{mm=[e.clientX/innerWidth,1-e.clientY/innerHeight];});
    const rs=()=>{const dpr=Math.min(devicePixelRatio||1,2);cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;gl.viewport(0,0,cv.width,cv.height);};
    rs();addEventListener('resize',rs);
    const t0=performance.now();
    const draw=()=>{const t=(performance.now()-t0)/1000;gl.uniform1f(ut,t);gl.uniform2f(ur,cv.width,cv.height);gl.uniform2f(um,mm[0],mm[1]);gl.drawArrays(gl.TRIANGLES,0,3);if(!RM)requestAnimationFrame(draw);};
    draw();
  } else if(cv){ cv.remove(); }
})();
</script>
